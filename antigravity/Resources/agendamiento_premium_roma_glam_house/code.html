<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Agendar Cita</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Reserva tu momento de relajación y belleza.</p>
</div>
<!-- Booking Form -->
<form action="#" class="space-y-6 relative z-10" method="POST">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Nombre -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-primary uppercase" for="nombre">Nombre Completo</label>
<input class="form-input rounded px-4 py-3 font-body-md text-body-md text-on-surface w-full" id="nombre" name="nombre" placeholder="Tu nombre" required="" type="text">
</div>
<!-- Teléfono -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-primary uppercase" for="telefono">Teléfono</label>
<input class="form-input rounded px-4 py-3 font-body-md text-body-md text-on-surface w-full" id="telefono" name="telefono" placeholder="Tu número de contacto" required="" type="tel">
</div>
</div>
<!-- Profesión -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-primary uppercase" for="profesion">Profesión u Ocupación</label>
<input class="form-input rounded px-4 py-3 font-body-md text-body-md text-on-surface w-full" id="profesion" name="profesion" placeholder="Para conocerte mejor" type="text">
</div>
<!-- Primera Vez -->
<div class="flex items-center space-x-3 py-2">
<input class="custom-checkbox w-5 h-5 rounded-sm border-outline-variant text-primary-container focus:ring-primary-container focus:ring-offset-background" id="primera_vez" name="primera_vez" type="checkbox">
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="primera_vez">¿Es tu primera vez con nosotros?</label>
</div>
<!-- Fecha y Servicio -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Fecha -->
<div class="flex flex-col space-y-2 relative">
<label class="font-label-md text-label-md text-primary uppercase" for="fecha">Fecha Deseada</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline">calendar_today</span>
<input class="form-input rounded pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface w-full" id="fecha" name="fecha" required="" type="date">
</div>
</div>
<!-- Servicio -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-primary uppercase" for="servicio">Servicio Principal</label>
<select class="form-input rounded px-4 py-3 font-body-md text-body-md text-on-surface w-full appearance-none bg-transparent" id="servicio" name="servicio" required="">
<option disabled="" selected="" value="">Selecciona un servicio...</option>
<option value="manicure_spa">Manicure Spa</option>
<option value="pedicure_spa">Pedicure Spa</option>
<option value="unas_acrilicas">Uñas Acrílicas</option>
<option value="gel_semipermanente">Gel Semipermanente</option>
</select>
</div>
</div>
<!-- Botón Añadir Servicio (Simulado) -->
<div class="flex justify-end">
<button class="flex items-center space-x-2 text-primary hover:text-primary-container transition-colors duration-300 font-label-md text-label-md" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
<span class="">Añadir otro servicio</span>
</button>
</div>
<!-- Información Médica -->
<div class="flex flex-col space-y-2 pt-4 border-t border-outline-variant/30">
<label class="font-label-md text-label-md text-primary uppercase" for="info_medica">Información Médica Relevante</label>
<select class="form-input rounded px-4 py-3 font-body-md text-body-md text-on-surface w-full appearance-none bg-transparent" id="info_medica" name="info_medica">
<option selected="" value="ninguna">Ninguna condición relevante</option>
<option value="diabetes">Diabetes</option>
<option value="onicomicosis">Onicomicosis (Hongos)</option>
<option value="una_encarnada">Uña Encarnada</option>
<option value="alergias">Alergias a productos químicos</option>
<option value="otra">Otra (Especificar al llegar)</option>
</select>
<p class="text-label-sm text-outline mt-1">Esta información es confidencial y nos ayuda a brindarte un mejor servicio.</p>
</div>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full bg-primary-container hover:bg-primary text-[#FFD700] font-headline-md text-headline-md py-4 rounded shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center space-x-2" type="submit">
<span class="">Confirmar Cita</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</form>
